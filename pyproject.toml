[project]
name = "fastlab"
version = "0.1.0"
description = "Transparent reimplementations of pi-0.x components: FAST action tokenization, and MEM's memory encoder at 2-D scale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# Only needed for experiments/05_official_parity.py, which compares this
# reimplementation against the real physical-intelligence/fast tokenizer.
official = [
    "transformers>=4.44",
    "torch>=2.4",
    "huggingface-hub>=0.24",
]
# Only needed for experiments that pull real robot action chunks.
data = [
    "huggingface-hub>=0.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
]
# Only needed for the memlab experiments (07, 08), which build MEM's memory
# encoder in PyTorch. A CPU build is enough for both -- they do no training.
mem = [
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastlab", "src/memlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
